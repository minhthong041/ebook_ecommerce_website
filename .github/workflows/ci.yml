name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ebook_ecommerce_db
          POSTGRES_USER: ebook_user
          POSTGRES_PASSWORD: ebook_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebook_user -d ebook_ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: django-insecure-ci-key
      DEBUG: "True"
      DB_NAME: ebook_ecommerce_db
      DB_USER: ebook_user
      DB_PASSWORD: ebook_password_123
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: backend
        run: python manage.py check

      - name: Check migrations are committed
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
